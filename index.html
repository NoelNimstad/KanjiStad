<!DOCTYPE html>
<html>
    <head>
        <script src="js/index.js" defer></script>
        <link rel="stylesheet" href="css/index.css">
    </head>
    <body>
        <div class="top">
            <div class="top-container">
                <h2 id="welcome"></h2>
                <img src="resources/pfp.png" class="pfp">
            </div>
        </div>
        <main>
            <div>
                <div class="levels">
                    <div class="flex">
                        <div>
                            <h2>書く</h2>
                            <p>Write kanji from vocab based on WaniKani™ levels</p>
                        </div>
                        <img src="resources/KanjiStadCat.png">
                    </div>
                    <div>
                        <input type="range" min="1" max="60" id="range">
                        <div id="levels"></div>
                    </div>
                    <button id="go">スタート</button>
                </div>
            </div>
            <div>
                <div class="banana_container">
                    <div class="banana">
                        <h2>前回のデータ</h2>
                        <p>時間: <span id="timeLast"><sup>n</sup>/<sub>a</sub></span></p>
                        <p>単語: <span id="countLast"><sup>n</sup>/<sub>a</sub></span></p>
                        <p>精度: <span id="accuracyLast"><sup>n</sup>/<sub>a</sub></span></p>
                    </div>
                    <div class="banana">
                        <h2>ミス</h2>
                        <p>工事中</p>
                    </div>
                </div>
            </div>
        </main>
        <div id="summary">
            <h2>よくやったね！</h2>
            <p>Accuracy <b id="percentage">50%</b> <span id="items">5/10</span></p>
            <p>Time <b id="time">10s</b></p>
            <button id="close">閉ジル</button>
        </div>
        <button id="logout">ログアウト</button>
        <p id="level"></p>
    </body>
</html>
